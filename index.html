
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ဝင်ငွေထွက်ငွေစာရင်း</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f1f5fb;color:#172554;
 font-family:Arial,sans-serif;
}
header{
 background:linear-gradient(135deg,#0755c9,#1688ee);
 color:white;padding:25px 20px 35px;
 border-radius:0 0 25px 25px;
}
header h2{margin:0 0 8px;font-size:23px}
header p{margin:0;opacity:.85}
.container{padding:18px;max-width:600px;margin:auto}
.balance{
 background:white;padding:22px;border-radius:18px;
 box-shadow:0 4px 15px #0000000d;margin-top:-5px;
}
.balance small{color:#64748b}
.amount{font-size:30px;font-weight:bold;margin-top:8px;color:#0755c9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}
.card{
 background:white;padding:17px;border-radius:15px;
 box-shadow:0 3px 12px #00000008;
}
.card small{color:#64748b}
.card h3{font-size:19px;margin:10px 0 0}
.green{color:#079455}.red{color:#e33d52}
.section{
 background:white;padding:18px;border-radius:17px;
 margin-top:16px;
}
.section h3{margin:0 0 15px}
input,select{
 width:100%;padding:13px;margin:7px 0;
 border:1px solid #dbe3ef;border-radius:10px;
 font-size:16px;background:white;
}
button{
 border:0;border-radius:10px;padding:13px;
 font-size:15px;font-weight:bold;cursor:pointer;
}
.submit{width:100%;background:#0866d9;color:white;margin-top:8px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;background:#e7effb;color:#0755c9}
.tabs button.active{background:#075fd1;color:white}
.item{
 display:flex;justify-content:space-between;
 align-items:center;padding:13px 0;
 border-bottom:1px solid #edf0f5;gap:10px;
}
.item:last-child{border:0}
.item small{display:block;color:#64748b;margin-top:5px}
.delete{background:#fff0f1;color:#df3448;padding:8px 11px}
.empty{text-align:center;color:#94a3b8;padding:20px}
footer{text-align:center;color:#94a3b8;padding:25px;font-size:12px}
</style>
</head>
<body>
<header>
<h2>📒 ဝင်ငွေ / ထွက်ငွေစာရင်း</h2>
<p>Income & Expense Management</p>
</header>

<div class="container">
<div class="balance">
<small>လက်ကျန်ငွေ စုစုပေါင်း</small>
<div class="amount" id="balance">0 ကျပ်</div>
</div>

<div class="grid">
<div class="card">
<small>📈 စုစုပေါင်း ဝင်ငွေ</small>
<h3 class="green" id="income">0</h3>
</div>
<div class="card">
<small>📉 စုစုပေါင်း ထွက်ငွေ</small>
<h3 class="red" id="expense">0</h3>
</div>
</div>

<div class="section">
<h3>➕ စာရင်းအသစ်သွင်းရန်</h3>
<div class="tabs">
<button id="inTab" class="active" onclick="setType('income')">ဝင်ငွေ</button>
<button id="outTab" onclick="setType('expense')">ထွက်ငွေ</button>
</div>

<input id="title" placeholder="အကြောင်းအရာ ရေးပါ">
<input id="money" type="number" min="1" placeholder="ငွေပမာဏ (ကျပ်)">
<input id="date" type="date">
<button class="submit" onclick="addRecord()">စာရင်းသိမ်းမည်</button>
</div>

<div class="section">
<h3>📋 စာရင်းမှတ်တမ်း</h3>
<select id="filter" onchange="render()">
<option value="all">စာရင်းအားလုံး</option>
<option value="income">ဝင်ငွေများ</option>
<option value="expense">ထွက်ငွေများ</option>
</select>
<div id="records"></div>
</div>
<footer>ဝင်ငွေ / ထွက်ငွေစာရင်း App © 2026</footer>
</div>

<script>
let records=JSON.parse(localStorage.getItem('myRecords')||'[]');
let currentType='income';

const fmt=n=>Number(n).toLocaleString('en-US')+' ကျပ်';

document.getElementById('date').value=
new Date().toISOString().slice(0,10);

function setType(type){
 currentType=type;
 document.getElementById('inTab').classList.toggle('active',type==='income');
 document.getElementById('outTab').classList.toggle('active',type==='expense');
}

function save(){
 localStorage.setItem('myRecords',JSON.stringify(records));
 render();
}

function addRecord(){
 const title=document.getElementById('title').value.trim();
 const money=Number(document.getElementById('money').value);
 const date=document.getElementById('date').value;

 if(!title||!money||money<=0||!date){
  alert('အချက်အလက်အားလုံး မှန်ကန်စွာ ဖြည့်ပေးပါ။');
  return;
 }

 records.unshift({
  id:Date.now(),title,money,date,type:currentType
 });

 document.getElementById('title').value='';
 document.getElementById('money').value='';
 save();
 alert('စာရင်းသိမ်းပြီးပါပြီ။');
}

function removeRecord(id){
 if(confirm('ဒီစာရင်းကို ဖျက်မှာ သေချာပါသလား။')){
  records=records.filter(r=>r.id!==id);
  save();
 }
}

function render(){
 const inc=records.filter(r=>r.type==='income')
 .reduce((s,r)=>s+r.money,0);
 const out=records.filter(r=>r.type==='expense')
 .reduce((s,r)=>s+r.money,0);

 document.getElementById('income').textContent=fmt(inc);
 document.getElementById('expense').textContent=fmt(out);
 document.getElementById('balance').textContent=fmt(inc-out);

 const filter=document.getElementById('filter').value;
 const list=records.filter(r=>filter==='all'||r.type===filter);
 const area=document.getElementById('records');

 if(!list.length){
  area.innerHTML='<div class="empty">စာရင်းမရှိသေးပါ။</div>';
  return;
 }

 area.innerHTML=list.map(r=>`
 <div class="item">
 <div>
 <b>${escapeHTML(r.title)}</b>
 <small>${r.date} · ${r.type==='income'?'ဝင်ငွေ':'ထွက်ငွေ'}</small>
 <b class="${r.type==='income'?'green':'red'}">
 ${r.type==='income'?'+':'-'} ${fmt(r.money)}
 </b>
 </div>
 <button class="delete" onclick="removeRecord(${r.id})">ဖျက်</button>
 </div>
 `).join('');
}

function escapeHTML(s){
 return s.replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;',
 '"':'&quot;',"'":'&#39;'
 })[c]);
}

render();
</script>
</body>
</html>
